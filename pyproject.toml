[project]
name = "atelier-mcp-enveloppes"
version = "0.1.0"
description = "Atelier AVISIA — MCP local : classement de factures dans les enveloppes CE / Académie (formulaires .xlsx, sans cloud)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.27.2",
    "openpyxl>=3.1.5",
    "pymupdf>=1.24",
]

[tool.uv]
# Projet applicatif (pas une lib publiée) : uv gère deps + lancement, sans build du package.
package = false
